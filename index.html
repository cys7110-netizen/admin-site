// Supabase → React 格式轉換
function dbToLocal(row) {
  return {
    id: row.id,
    empNo: row.emp_no || '',
    name: row.name || '',
    type: row.emp_type || '正職員工',
    phone: row.phone || '',

// React → Supabase 格式轉換
function localToDb(emp) {
  return {
    emp_no: emp.empNo,
    name: emp.name,
    emp_type: emp.type,
    phone: emp.phone || '',
    visa: emp.visa || null,
    visa_type: emp.visaType || '',

    monthly_salary: +emp.msalary || 0,
    start_date: emp.startDate || null,
    resigned: emp.resigned || false,
    resign_date: emp.resignDate || null,
    password: emp.password || emp.empNo,
    role: emp.role || 'staff',
    notes: emp.notes || ''

function monthsDiff(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  const n = new Date();
  return (n.getFullYear() - d.getFullYear()) * 12 + (n.getMonth() - d.getMonth()) + (n.getDate() < d.getDate() ? -1 : 0);
}

function daysLeft(d) { if (!d) return null; return Math.ceil((new Date(d) - new Date()) / 864e5); }
function tenure(startDate) {
  if (!startDate) return "";
  const s = new Date(startDate), n = new Date();
  let y = n.getFullYear() - s.getFullYear(), m = n.getMonth() - s.getMonth();
  if (n.getDate() < s.getDate()) m--;
  if (m < 0) { y--; m += 12; }
  if (y > 0 && m > 0) return `${y}年${m}個月`;
  if (y > 0) return `${y}年`;
  if (m > 0) return `${m}個月`;
  return "未滿1個月";
}
function calcTax(amount) {
  const incomeTax = Math.round(amount * 0.03);
  const localTax = Math.round(amount * 0.003);
  return { incomeTax, localTax, total: incomeTax + localTax, net: amount - incomeTax - localTax };
}

// ═══ KST (韓國時區 UTC+9) 工具函式 ═══
function getKSTTodayRange() {
  var now = new Date();
  var kst = new Date(now.getTime() + 9 * 3600000);
  var startMs = Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()) - 9 * 3600000;
  return { startMs: startMs, endMs: startMs + 86400000 };
}
function isInRange(ts, startMs, endMs) {
  if(!ts) return false;
  var t = new Date(ts).getTime();
  return !isNaN(t) && t >= startMs && t < endMs;
}
function pkgInRange(p, startMs, endMs) {
  return isInRange(p.scanned_at, startMs, endMs)
      || (!p.scanned_at && isInRange(p.created_at, startMs, endMs));
}

  { k:'VIP', kg:100, discount:5, downMonths:2, c:'#c4953a', bg:'#f5ead4', icon:'⭐' },
  { k:'VVIP', kg:300, discount:10, downMonths:3, c:'#b8860b', bg:'#f5ecd0', icon:'👑' },
  { k:'SVIP', kg:500, discount:15, downMonths:3, c:'#7b2d8e', bg:'#f0e0f5', icon:'💎' },
];
const GRADE_KEYS = GRADES.map(g=>g.k);
function getGradeInfo(k){ return GRADES.find(g=>g.k===k)||GRADES[0]; }
function calcGrade(monthlyKg){
  // monthlyKg[0]=上月, [1]=2個月前, ... 用總出貨重量
  var lm=monthlyKg[0]||0;
  // 升級：上月達標直接升
  if(lm>=500)return'SVIP'; if(lm>=300)return'VVIP'; if(lm>=100)return'VIP';
  // 降級保護：曾達標且未連續N月未達標
  for(var g=3;g>=1;g--){var gi=GRADES[g];var earned=false;
    for(var i=1;i<=5;i++)if((monthlyKg[i]||0)>=gi.kg){earned=true;break;}
    if(earned){var below=0;for(var i=0;i<gi.downMonths&&i<monthlyKg.length;i++){if((monthlyKg[i]||0)<gi.kg)below++;else break;}
    if(below<gi.downMonths)return gi.k;}
  }
  return'一般';
}
function calcWorkHours(clockIn, clockOut) {
  if(!clockIn||!clockOut) return 0;
  var p1=clockIn.split(':'),p2=clockOut.split(':');
  var inM=parseInt(p1[0])*60+parseInt(p1[1]||0);
  var outM=parseInt(p2[0])*60+parseInt(p2[1]||0);
  if(outM<=inM) outM+=1440;
  return Math.round((outM-inM)/60*10)/10;
}

// 試算運費（首重/續重邏輯 + VIP 折扣）
function calcShipCost(method, weightKg, grade, catIdx, ratesOverride) {
  var rates = ratesOverride || DEFAULT_SHIP_RATES;
  var r = rates[method];
  if(!r || !r.cats || r.cats.length===0) return null;
  var cat = r.cats[catIdx||0] || r.cats[0];
  var kg = Math.ceil(weightKg*10)/10; // 無條件進位到0.1
  if(kg<=0) return null;
  var gi = getGradeInfo(grade||'一般');

  var baseNTD=0, baseKRW=0;
  if(kg<5) {
    // 首重 + 續重 × (kg-1)
    var extra = Math.max(0, Math.ceil(kg)-1);
    baseNTD = (cat.under5.firstNTD||0) + extra*(cat.under5.nextNTD||0);
    baseKRW = (cat.under5.firstKRW||0) + extra*(cat.under5.nextKRW||0);
  } else {
    // 5kg以上：每公斤
    baseNTD = Math.round((cat.over5.perNTD||0) * kg);
    baseKRW = Math.round((cat.over5.perKRW||0) * kg);
  }

  // VIP 折扣只套用 NT$
  var discNTD = Math.round(gi.discount * kg);
  var finalNTD = Math.max(0, baseNTD - discNTD);

  return {
    method:r.label, cat:cat.name, weightKg:kg,
    ntd:{ base:baseNTD, discount:discNTD, final:finalNTD },
    krw:{ base:baseKRW, final:baseKRW },
    gradeDiscount:gi.discount,
    isUnder5: kg<5,
    pricing: kg<5
      ? {firstNTD:cat.under5.firstNTD, nextNTD:cat.under5.nextNTD, firstKRW:cat.under5.firstKRW, nextKRW:cat.under5.nextKRW}
      : {perNTD:cat.over5.perNTD, perKRW:cat.over5.perKRW}
  };
}

  function getKSTDates() {
    var kst = new Date(new Date().getTime() + 9 * 3600000);
    var todayStr = kst.getUTCFullYear()+'-'+String(kst.getUTCMonth()+1).padStart(2,'0')+'-'+String(kst.getUTCDate()).padStart(2,'0');
    var monthStr = kst.getUTCFullYear()+'-'+String(kst.getUTCMonth()+1).padStart(2,'0');
    return { todayStr, monthStr };
  }

  async function loadFinancials() {
    if(!sb) return;
    try {
      var { todayStr, monthStr } = getKSTDates();

      // 1) 營收 finance_records
      var { data: allFin } = await sb.from('finance_records').select('*').order('created_at',{ascending:false}).limit(200);
      allFin = allFin || [];
      var todayRev=0, monthRev=0, todayPay=0, monthPay=0;
      var recentTx=[], recentPay=[];
      allFin.forEach(function(r){
        var d = (r.date||'').substring(0,10);
        var m = (r.date||'').substring(0,7);
        if(r.type==='revenue') {
          if(d===todayStr) todayRev += r.amount;
          if(m===monthStr) monthRev += r.amount;
          recentTx.push(r);
        }
        if(r.type==='payment') {
          if(d===todayStr) todayPay += r.amount;
          if(m===monthStr) monthPay += r.amount;
          recentPay.push(r);
        }
      });

      // 1b) 出貨運費 → 加入營收 + 追蹤未收款
      var { data: shipTasks } = await sb.from('tasks').select('*');
      var allShipTasks = (shipTasks||[]).filter(function(t){ return (t.task_type==='ship'||t.type==='ship') && t.ship_cost > 0; });
      var shipRevMonth = 0;
      allShipTasks.filter(function(t){ return t.status==='completed'||t.status==='paid'; }).forEach(function(t){
        var d = (t.created_at||'').substring(0,10);
        var m = (t.created_at||'').substring(0,7);
        if(d === todayStr) todayRev += t.ship_cost;
        if(m === monthStr) { monthRev += t.ship_cost; shipRevMonth += t.ship_cost; }
      });

      // 1c) 未收款客戶分析（status=completed 且 ship_cost > 0 表示已出貨但未收款）
      var unpaidTasks = allShipTasks.filter(function(t){ return t.status==='completed' && t.ship_cost > 0; });
      var now = new Date();
      var unpaidByCustomer = {};
      var over30Total = 0;
      unpaidTasks.forEach(function(t){
        var mc = t.member_code || '未知';
        if(!unpaidByCustomer[mc]) unpaidByCustomer[mc] = {code:mc,amount:0,count:0,oldest:null};
        unpaidByCustomer[mc].amount += t.ship_cost;
        unpaidByCustomer[mc].count++;
        var created = t.created_at ? new Date(t.created_at) : now;
        var days = Math.max(0, Math.floor((now - created)/86400000));
        if(!unpaidByCustomer[mc].oldest || days > unpaidByCustomer[mc].days) {
          unpaidByCustomer[mc].oldest = (t.created_at||'').substring(5,10);
          unpaidByCustomer[mc].days = days;
        }
        if(days > 30) over30Total += t.ship_cost;
      });
      var unpaidList = Object.values(unpaidByCustomer).sort(function(a,b){ return b.amount - a.amount; });

      // 2) 支出 expenses（提前載入，趨勢計算需要）
      var { data: expRows } = await sb.from('expenses').select('*').order('created_at',{ascending:false});
      expRows = expRows || [];

      // 1d) 每月營收/利潤趨勢（最近5個月）
      var monthlyTrend = [];
      for(var mi = 4; mi >= 0; mi--) {
        var dt = new Date(now.getFullYear(), now.getMonth() - mi, 1);
        var ms = dt.getFullYear() + '-' + (dt.getMonth()+1<10?'0':'') + (dt.getMonth()+1);
        var mRev = 0, mExp = 0;
        allFin.forEach(function(r){ if(r.type==='revenue' && (r.date||'').substring(0,7)===ms) mRev += r.amount; });
        allShipTasks.filter(function(t){ return (t.status==='completed'||t.status==='paid') && (t.created_at||'').substring(0,7)===ms; }).forEach(function(t){ mRev += t.ship_cost; });
        expRows.forEach(function(r){ if((r.date||'').substring(0,7)===ms) mExp += r.amount; });
        monthlyTrend.push({m:ms.replace('-','/'), rev:mRev, exp:mExp, profit:mRev-mExp, rate:mRev>0?Math.round((mRev-mExp)/mRev*1000)/10:0});
      }

      // 本月支出
      var monthExp = expRows.filter(function(r){ return (r.date||'').substring(0,7)===monthStr; });
      // 分類加總做為支出管理列表
      var catMap = {};
      monthExp.forEach(function(r){
        if(!catMap[r.category]) catMap[r.category] = {id:r.id, label:r.category, amount:0};
        catMap[r.category].amount += r.amount;
      });
      var expList = Object.values(catMap);
      if(expList.length > 0) setExpenses(expList);

      // 飯錢 & 包材
      var meals = expRows.filter(function(r){ return r.category==='飯錢'; }).map(function(r){
        return {id:r.id, date:r.date, amount:r.amount, people:0, note:r.note||''};
      });
      var packs = expRows.filter(function(r){ return r.category==='包材'; }).map(function(r){
        return {id:r.id, date:r.date, item:r.note||'包材', amount:r.amount, qty:0, note:''};
      });
      if(meals.length > 0) setMealExpenses(meals);
      if(packs.length > 0) setPackingExpenses(packs);

      // finance_records 中的「其他營收」（非出貨）
      var finRevMonth = allFin.filter(function(r){ return r.type==='revenue' && (r.date||'').substring(0,7)===monthStr; }).reduce(function(s,r){ return s+r.amount; },0);

      // 出貨/付款清單（一年內全部）
      var shipListData = allShipTasks.map(function(t){
        return {
          id: t.id,
          date: (t.created_at||'').substring(0,10),
          memberCode: t.member_code||'—',
          weight: t.ship_weight||0,
          cost: t.ship_cost||0,
          logistic: t.ship_logistic||'',
          paid: !!(t.paid_at),
          paidAt: t.paid_at ? (t.paid_at+'').substring(0,10) : '',
          payInfo: t.pay_info||''
        };
      }).sort(function(a,b){ return b.date.localeCompare(a.date); });

      var monthExpTotal = monthExp.reduce(function(s,r){ return s+r.amount; },0);
      setFin({
        todayRev, monthRev, todayPay, outstanding: monthRev - monthPay,
        monthProfit: monthRev - monthExpTotal,
        recentTx: recentTx.slice(0,10), recentPay: recentPay.slice(0,10),
        monthExpTotal,
        shipRevenue: shipRevMonth, finRevenue: finRevMonth,
        unpaidList: unpaidList, over30Amount: over30Total, unpaidCustCount: unpaidList.length,
        monthlyTrend: monthlyTrend,
        shipList: shipListData
      });
      console.log('💰 財務載入完成:', {todayRev,monthRev,todayPay,monthExpTotal});
    } catch(e) { console.error('loadFinancials error:', e); }
  }

  async function loadPerformance() {
    if(!sb) return;
    try {
      var { todayStr, monthStr } = getKSTDates();
      var range = getKSTTodayRange();

      // KST 本月範圍（精確 KST 0:00 起訖）
      var kst = new Date(new Date().getTime() + 9 * 3600000);
      var monthStartMs = Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), 1) - 9 * 3600000;
      var monthEndMs = Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth() + 1, 1) - 9 * 3600000;
      var monthStartISO = new Date(monthStartMs).toISOString();
      var monthEndISO = new Date(monthEndMs).toISOString();

      // 抓全部包裹（一次查詢，分別算今日 / 本月）
      var {data:allPkgPerf} = await sb.from('packages').select('processed_by_name,created_at,scanned_at');
      allPkgPerf = allPkgPerf||[];

      var perfMap = {};
      var unknownToday = 0, unknownMonth = 0;

      // 今日入庫（KST 今日範圍，scanned_at 優先）
      allPkgPerf.forEach(function(p){
        if(!pkgInRange(p, range.startMs, range.endMs)) return;
        if(!p.processed_by_name) { unknownToday++; return; }
        var n = p.processed_by_name;
        if(!perfMap[n]) perfMap[n]={name:n,today:0,month:0};
        perfMap[n].today++;
      });

      // 本月入庫（KST 本月範圍，scanned_at 優先 > created_at）
      allPkgPerf.forEach(function(p){
        var ts = p.scanned_at || p.created_at;
        if(!ts) return;
        var t = new Date(ts).getTime();
        if(isNaN(t) || t < monthStartMs || t >= monthEndMs) return;
        if(!p.processed_by_name) { unknownMonth++; return; }
        var n = p.processed_by_name;
        if(!perfMap[n]) perfMap[n]={name:n,today:0,month:0};
        perfMap[n].month++;
      });

      var perfList = Object.values(perfMap).sort(function(a,b){return (b.month||0)-(a.month||0);});
      perfList._unknownToday = unknownToday;
      perfList._unknownMonth = unknownMonth;
      setEmpPerf(perfList);

      // 最近入庫活動（前10筆）
      var {data:recent} = await sb.from('packages').select('tracking_no,processed_by_name,scanned_at,status,member_code')
        .order('created_at',{ascending:false}).limit(10);
      setRecentActivity((recent||[]).map(function(r){
        var t = r.scanned_at ? new Date(r.scanned_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}) : '';
        return {time:t, name:r.processed_by_name||'—', track:r.tracking_no, status:r.status==='arrived'?'已入庫':'待處理', sc:r.status==='arrived'?'#5b9e6f':'#c4953a'};
      }));

      console.log('👷 績效載入:', perfList.length, '位員工');
    } catch(e){ console.error('loadPerformance error:', e); }
  }

  // ── 客戶管理（Supabase members + packages + tasks）──
  async function loadCustomers() {
    if(!sb) return;
    try {
      var {data:allMembers} = await sb.from('members').select('*').order('id');
      allMembers = allMembers||[];
      // 每位客戶的包裹統計
      var {data:allPkgs} = await sb.from('packages').select('member_code,weight_kg,scanned_at,created_at').order('created_at',{ascending:false});
      allPkgs = allPkgs||[];
      var pkgMap = {};
      allPkgs.forEach(function(p){
        var mc = p.member_code||'';
        if(!pkgMap[mc]) pkgMap[mc]={count:0,total:0,lastDate:''};
        pkgMap[mc].count++;
        var dt = p.scanned_at || p.created_at || '';
        if(dt && dt > (pkgMap[mc].lastDate||'')) pkgMap[mc].lastDate = dt;
      });

      // 出貨消費統計（從 tasks）
      var {data:allTasks} = await sb.from('tasks').select('*');
      var shipTasks = (allTasks||[]).filter(function(t){ return (t.task_type==='ship'||t.type==='ship') && (t.status==='completed'||t.status==='paid'); });
      var spendMap = {};
      var kst = new Date(new Date().getTime() + 9 * 3600000);
      var monthStr = kst.getUTCFullYear()+'-'+String(kst.getUTCMonth()+1).padStart(2,'0');
      // 計算最近6個月的月份字串
      var monthStrs = [];
      for(var mi=0;mi<6;mi++){
        var md=new Date(Date.UTC(kst.getUTCFullYear(),kst.getUTCMonth()-1-mi,1));
        monthStrs.push(md.getUTCFullYear()+'-'+String(md.getUTCMonth()+1).padStart(2,'0'));
      }

      shipTasks.forEach(function(t){
        var mc = t.member_code||'';
        if(!spendMap[mc]) spendMap[mc]={total:0,month:0,count:0,thisMonthKg:0,monthlyKg:[0,0,0,0,0,0]};
        spendMap[mc].total += (t.ship_cost||0);
        spendMap[mc].count++;
        var tMonth=(t.created_at||'').substring(0,7);
        if(tMonth===monthStr) { spendMap[mc].month += (t.ship_cost||0); spendMap[mc].thisMonthKg += (t.ship_weight||0); }
        // 統計最近6個月出貨重量
        for(var mi=0;mi<6;mi++){
          if(tMonth===monthStrs[mi]) { spendMap[mc].monthlyKg[mi] += (t.ship_weight||0); break; }
        }
      });

      var list = allMembers.map(function(m){
        var stats = pkgMap[m.member_code]||{count:0,lastDate:''};
        var spend = spendMap[m.member_code]||{total:0,month:0,count:0,thisMonthKg:0,monthlyKg:[0,0,0,0,0,0]};
        var lastD = stats.lastDate ? new Date(stats.lastDate).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'}) : '—';
        var autoGrade = calcGrade(spend.monthlyKg);
        // 手動等級覆蓋優先
        var mg = manualGradesRef.current[m.member_code];
        var grade = (mg && mg.grade && GRADE_KEYS.includes(mg.grade)) ? mg.grade : autoGrade;
        var isManual = !!(mg && mg.grade && GRADE_KEYS.includes(mg.grade));
        var gi = getGradeInfo(grade);
        return {
          id:m.id, code:m.member_code, name:m.name||m.member_code,
          phone:m.phone||'', email:m.email||'', line_id:m.line_id||'', address:m.address||'', note:m.note||'',
          pkgCount:stats.count, lastDate:lastD,
          totalSpend: spend.total, monthSpend: spend.month, shipCount: spend.count,
          grade: grade, gradeInfo: gi, autoGrade: autoGrade,
          isManual: isManual, manualInfo: isManual?mg:null,
          lastMonthKg: spend.monthlyKg[0], thisMonthKg: spend.thisMonthKg,
          monthlyKg: spend.monthlyKg,
          discount: gi.discount,
          created_at: m.created_at||''
        };
      }).sort(function(a,b){return b.totalSpend-a.totalSpend;});
      setCustList(list);
      setCustStats({
        total: list.length,
        active: list.filter(function(c){return c.pkgCount>0;}).length,
        vip: list.filter(function(c){return c.grade!=='一般';}).length
      });
      console.log('👥 客戶載入:', list.length, '位');
    } catch(e){ console.error('loadCustomers error:', e); }
  }

  // ── Salary Calc ──
  const calcEmp = emps.find(e => String(e.id) === String(calcEmpId));

  const hours = +calcHours || 0, otHours = +calcOtHours || 0, bonus = +calcBonus || 0, otherExp = +calcOther || 0, transfer = +calcTransfer || 0, monthSal = +calcMonthSal || 0;

            {/* ═══ HR: 居留簽證 ═══ */}
            {tab === "hr-visa" && (() => {
              const visaEmps = emps.filter(e => e.visa).sort((a, b) => new Date(a.visa) - new Date(b.visa));
              return (
                <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                  {visaEmps.length === 0 ? <div style={{ textAlign: "center", padding: 50, color: "#8a9ab0", fontSize: 13 }}>目前沒有需要追蹤的簽證</div>
                  : visaEmps.map(e => {
                    const days = daysLeft(e.visa); let vc = "#5b9e6f", vl = `${days}天`, bg = "#fff";
                    if (days < 0) { vc = "#c0504d"; vl = "已過期"; bg = "#fdf5f5"; } else if (days <= 30) { vc = "#c0504d"; bg = "#fdf5f5"; } else if (days <= 90) { vc = "#c4953a"; bg = "#fdf9f0"; }
                    return (
                      <div key={e.id} style={{ background: bg, borderRadius: 8, padding: "14px 16px", border: `1px solid ${days <= 30 ? "#f0d0ce" : days <= 90 ? "#eddcb5" : "#dce3ed"}`, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                        <Dot id={e.id} />
                        <div style={{ flex: 1, minWidth: 80 }}>
                          <div style={{ fontWeight: 600, fontSize: 14 }}>{e.empNo && <span style={{ color: "#7a8a9e", fontWeight: 500, marginRight: 6 }}>{e.empNo}</span>}{e.name}</div>
                          <div style={{ fontSize: 11, color: "#8a9ab0" }}>{e.type}</div>
                        </div>
                        {e.visaType && <span style={{ fontSize: 12, fontWeight: 600, color: "#34537d", background: "#e8edf4", padding: "3px 10px", borderRadius: 5 }}>{e.visaType}</span>}
                        <div style={{ textAlign: "right", minWidth: 90 }}><div style={{ fontSize: 12, color: "#7a8a9e" }}>{e.visa}</div><div style={{ fontSize: 13, fontWeight: 600, color: vc }}>{vl}</div></div>
                      </div>);
                  })}
                </div>);
            })()}

          </div>
        </div>
      </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(KshipApp));
</script>
</body>
</html>
